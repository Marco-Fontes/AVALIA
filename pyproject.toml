[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avalia"
version = "0.11.0"
description = "AVALIA — avaliador ESTÁTICO de sistemas multiagentes de IA (Fase 1)"
requires-python = ">=3.12"
# Stack fechada (plan.md v1.3 / CLAUDE.md): LangGraph + LangChain + Pydantic v2 +
# tree-sitter + Postgres/JSONB. Acesso a modelo só via ModelGateway (Anthropic/OpenRouter).
dependencies = [
  "pydantic>=2.7",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  # M10 — 2º extrator (Decisão Técnica #1): TS/JS via tree-sitter (estrutural, best-effort).
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "psycopg[binary]>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# LangSmith é opcional — ausência NÃO pode quebrar o import nem a geração do laudo (MS-10).
observability = ["langsmith>=0.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
# Porta de entrada de uso (MVP): `avalia <caminho-do-alvo>`.
avalia = "avalia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avalia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixtures são DADOS de teste (alvos sintéticos: ofuscado, contradições) — intencionalmente
# não-idiomáticos. Não devem ser lintados nem formatados.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
# T-1009 (v1.4): gate de cobertura. Só mede com `--cov` (a suíte padrão segue rápida).
source = ["avalia"]
branch = true

[tool.coverage.report]
# Piso medido em 2026-09-23: 92% (local, sem os testes de Postgres). 1 ponto de folga para
# ramificações que variam entre SO/ambiente; no CI (com Postgres) a cobertura fica acima.
fail_under = 91
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# Deps da stack ainda sem stubs completos: não falhar por import de terceiros.
ignore_missing_imports = true
